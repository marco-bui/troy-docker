version: '3.8'

services:
  backend:
    image: troy
    build: .
    container_name: troy
    restart: always
    env_file: .env
    ports:
      - "4869:4869"
    networks:
      - troy
    volumes:
      - ./assets:/app/assets
    environment:
      - TZ=Asia/Ho_Chi_Minh

networks:
  troy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.220.117.0/24
          gateway: 172.220.117.1